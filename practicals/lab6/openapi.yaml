openapi: 3.0.3
info:
  title: Каталог компьютерных игр
  version: 1.0.0
  description: Учебная спецификация. Ответы Prism являются имитационными.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: http://127.0.0.1:3106
tags:
- name: Games
  description: Просмотр и изменение каталога игр
paths:
  /games:
    get:
      tags:
      - Games
      operationId: listGames
      summary: Список игр
      responses:
        '200':
          description: Список игр
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Game'
        '400':
          description: Некорректный запрос
    post:
      tags:
      - Games
      operationId: createGame
      summary: Добавить игру
      requestBody: &id001
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameInput'
      responses:
        '201':
          description: Игра создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '422':
          description: Ошибка валидации
  /games/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    get:
      tags:
      - Games
      operationId: getGame
      summary: Найти игру
      responses:
        '200':
          description: Игра
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '404':
          description: Не найдена
    put:
      tags:
      - Games
      operationId: updateGame
      summary: Изменить игру
      requestBody: *id001
      responses:
        '200':
          description: Игра изменена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '404':
          description: Не найдена
        '422':
          description: Ошибка валидации
    delete:
      tags:
      - Games
      operationId: deleteGame
      summary: Удалить игру
      responses:
        '204':
          description: Удалена
        '404':
          description: Не найдена
components:
  schemas:
    Game:
      type: object
      required:
      - id
      - title
      - genre
      - price
      properties:
        id:
          type: integer
          minimum: 1
          example: 1
        title: &id002
          type: string
          minLength: 1
          example: Portal 2
        genre: &id003
          type: string
          example: Головоломка
        price: &id004
          type: number
          minimum: 0
          example: 399
    GameInput:
      type: object
      required:
      - title
      - genre
      - price
      properties:
        title: *id002
        genre: *id003
        price: *id004
security: []
