type Author { id: ID!, name: String!, books: [Book!]! }
type Book { id: ID!, name: String!, genre: String!, author: Author! }
input BookInput { name: String!, genre: String!, authorId: ID! }
type Query { books: [Book!]!, book(id: ID!): Book, authors: [Author!]! }
type Mutation { addBook(input: BookInput!): Book!, updateBook(id: ID!, input: BookInput!): Book!, deleteBook(id: ID!): Boolean! }
