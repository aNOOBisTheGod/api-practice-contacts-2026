<!doctype html><html lang="ru"><meta charset="utf-8"><title>GraphQL — библиотека</title><style>body{font:16px system-ui;max-width:1100px;margin:40px auto;padding:0 24px;color:#17253b}h1{font-size:30px}p{color:#536078}form{background:#f1f5f9;padding:24px;border-radius:12px}label{display:inline-block;margin:8px}input,textarea,button{font:inherit;padding:10px;border:1px solid #b9c4d2;border-radius:6px}button{background:#164b89;color:white;cursor:pointer;margin:4px}table{border-collapse:collapse;width:100%;margin-top:24px}td,th{text-align:left;padding:13px;border-bottom:1px solid #ddd}pre{background:#f1f5f9;padding:18px;white-space:pre-wrap;word-break:break-word}textarea{width:95%;height:150px}</style><h1>Библиотека GraphQL</h1><p>Практическая № 7 · SDL + Apollo Server + веб-клиент</p><label for="query">Запрос</label><textarea id="query">query { books { id name genre author { name } } }</textarea><button id="send">Выполнить запрос</button><p id="status"></p><pre id="response"></pre><script>
document.querySelector('#send').onclick=async()=>{try{const r=await fetch('http://127.0.0.1:3107/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:document.querySelector('#query').value})});document.querySelector('#status').textContent='HTTP '+r.status;document.querySelector('#response').textContent=JSON.stringify(await r.json(),null,2);}catch(e){document.querySelector('#response').textContent=e.message;}};
</script></html>
